<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>test-all — GitHub 2FA codes</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --code: #4ade80;
    --error: #f87171;
    --border: #475569;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .container { max-width: 720px; margin: 0 auto; padding: 40px 24px; }
  h1 { margin: 0 0 24px; font-size: 24px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .prompt { background: var(--panel); border-radius: 12px; padding: 32px; }
  .prompt label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .prompt input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 16px; font-family: inherit;
  }
  .prompt input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .prompt button {
    margin-top: 16px; width: 100%; padding: 12px 14px; border-radius: 8px; border: none;
    background: var(--accent); color: #0f172a; font-size: 16px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .prompt button:hover { filter: brightness(1.1); }
  .error { color: var(--error); font-size: 14px; margin-top: 12px; min-height: 20px; }

  .status-bar {
    display: flex; align-items: center; gap: 16px; padding: 16px 20px;
    background: var(--panel); border-radius: 12px; margin-bottom: 16px;
  }
  .ring { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: var(--panel-2); }
  .ring .progress { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.9s linear; }
  .ring-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .status-info { display: flex; flex-direction: column; }
  .status-info .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .status-info .value { font-size: 15px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--panel-2); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .account-name { font-size: 15px; }
  .code {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 22px; color: var(--code); font-variant-numeric: tabular-nums; letter-spacing: 0.05em;
    cursor: pointer; user-select: all;
  }
  .code.copied::after { content: " ✓"; color: var(--muted); font-size: 14px; }
  .code:hover { filter: brightness(1.2); }
  .footer { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>test-all — GitHub 2FA codes</h1>

  <div id="prompt" class="prompt">
    <p class="subtitle">Enter the class password to view current codes.</p>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button id="unlock-btn">Unlock</button>
    <div class="error" id="error"></div>
  </div>

  <div id="content" hidden>
    <div class="status-bar">
      <div class="ring">
        <svg width="44" height="44"><circle class="track" cx="22" cy="22" r="18"></circle><circle id="ring-progress" class="progress" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="0"></circle></svg>
        <div class="ring-text" id="countdown">30</div>
      </div>
      <div class="status-info">
        <span class="label">Codes refresh every</span>
        <span class="value">30 seconds — synced with Google Authenticator</span>
      </div>
    </div>

    <table>
      <thead><tr><th>Account</th><th>Current code</th></tr></thead>
      <tbody id="codes-body"></tbody>
    </table>
    <p class="footer">Click any code to copy it to the clipboard.</p>
  </div>
</div>

<script>

  const PBKDF2_ITERATIONS = 200000;
  const REFRESH_MS = 1000;
  const TOTP_PERIOD = 30;

  // ---------- Utilities ----------
  function b64toBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  const B32_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  function base32ToBytes(b32) {
    const cleaned = b32.toUpperCase().replace(/=+$/, "").replace(/\s+/g, "");
    let bits = "";
    for (const c of cleaned) {
      const idx = B32_ALPHABET.indexOf(c);
      if (idx < 0) throw new Error("Invalid base32 character: " + c);
      bits += idx.toString(2).padStart(5, "0");
    }
    const bytes = new Uint8Array(Math.floor(bits.length / 8));
    for (let i = 0; i < bytes.length; i++) {
      bytes[i] = parseInt(bits.substr(i * 8, 8), 2);
    }
    return bytes;
  }

  // ---------- TOTP ----------
  const totpKeyCache = new Map();
  async function getKey(secretB32) {
    if (totpKeyCache.has(secretB32)) return totpKeyCache.get(secretB32);
    const key = await crypto.subtle.importKey(
      "raw", base32ToBytes(secretB32),
      { name: "HMAC", hash: "SHA-1" }, false, ["sign"]
    );
    totpKeyCache.set(secretB32, key);
    return key;
  }
  async function totp(secretB32, timestampSec) {
    const counter = Math.floor(timestampSec / TOTP_PERIOD);
    const buf = new ArrayBuffer(8);
    const view = new DataView(buf);
    view.setUint32(0, Math.floor(counter / 0x100000000));
    view.setUint32(4, counter >>> 0);
    const key = await getKey(secretB32);
    const hmac = new Uint8Array(await crypto.subtle.sign("HMAC", key, buf));
    const off = hmac[hmac.length - 1] & 0x0F;
    const num = (
      ((hmac[off] & 0x7F) << 24) |
      ((hmac[off + 1] & 0xFF) << 16) |
      ((hmac[off + 2] & 0xFF) << 8) |
      (hmac[off + 3] & 0xFF)
    );
    return String(num % 1000000).padStart(6, "0");
  }

  // ---------- Decryption ----------
  async function decryptBundle(password) {
    const bundle = b64toBytes(BUNDLE_B64);
    const salt = bundle.slice(0, 16);
    const iv = bundle.slice(16, 28);
    const ciphertext = bundle.slice(28);

    const pwKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password),
      { name: "PBKDF2" }, false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
      pwKey,
      { name: "AES-GCM", length: 256 },
      false, ["decrypt"]
    );
    const plaintext = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
    return JSON.parse(new TextDecoder().decode(plaintext));
  }

  // ---------- UI ----------
  let secrets = null;

  async function renderCodes() {
    const now = Math.floor(Date.now() / 1000);
    const body = document.getElementById("codes-body");
    if (!body.children.length) {
      for (const label of Object.keys(secrets)) {
        const tr = document.createElement("tr");
        tr.innerHTML = "<td class=\"account-name\"></td><td class=\"code\"></td>";
        tr.querySelector(".account-name").textContent = label;
        tr.querySelector(".code").addEventListener("click", async (e) => {
          const text = e.target.textContent.replace(/[^0-9]/g, "");
          try { await navigator.clipboard.writeText(text); } catch (_) {}
          e.target.classList.add("copied");
          setTimeout(() => e.target.classList.remove("copied"), 1200);
        });
        body.appendChild(tr);
      }
    }
    const rows = body.children;
    let i = 0;
    for (const label of Object.keys(secrets)) {
      const code = await totp(secrets[label], now);
      rows[i].querySelector(".code").textContent = code.slice(0, 3) + " " + code.slice(3);
      i++;
    }
  }

  function tick() {
    const now = Date.now() / 1000;
    const inPeriod = now % TOTP_PERIOD;
    const remain = TOTP_PERIOD - inPeriod;
    const circumference = 2 * Math.PI * 18;
    const offset = circumference * (inPeriod / TOTP_PERIOD);
    document.getElementById("ring-progress").setAttribute("stroke-dashoffset", offset);
    document.getElementById("countdown").textContent = Math.ceil(remain);
    renderCodes();
  }

  async function unlock() {
    const pw = document.getElementById("pw").value;
    const err = document.getElementById("error");
    err.textContent = "";
    try {
      secrets = await decryptBundle(pw);
    } catch (e) {
      err.textContent = "Incorrect password.";
      return;
    }
    document.getElementById("prompt").hidden = true;
    document.getElementById("content").hidden = false;
    tick();
    setInterval(tick, REFRESH_MS);
  }

  document.getElementById("unlock-btn").addEventListener("click", unlock);
  document.getElementById("pw").addEventListener("keydown", (e) => {
    if (e.key === "Enter") unlock();
  });
})();
</script>
